name: ci
on: { push: { branches: [main] }, pull_request: {} }
permissions: { contents: read }
jobs:
  # A workflow that fails to parse reports no checks at all, which reads
  # exactly like checks that have not started. actionlint is the first lane.
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      # Say which toolchain ran: a number measured under an unrecorded
      # compiler cannot be attributed.
      - run: go version
      - name: nothing big is tracked
        shell: bash
        run: |
          big=$(git ls-files -z | xargs -0 -I{} find {} -size +1M 2>/dev/null || true)
          if [ -n "$big" ]; then
            echo "::error::tracked files over 1 MB:"; echo "$big"; exit 1
          fi
      - name: gofmt
        shell: bash
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then echo "::error::not gofmt-ed:"; echo "$out"; exit 1; fi
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - name: go test -race, with coverage
        shell: bash
        run: |
          CGO_ENABLED=1 go test -race -count=1 -coverpkg=./... -coverprofile=cov.out ./...
          go tool cover -func=cov.out > cov.txt
          tail -1 cov.txt
          echo "### Coverage (${{ matrix.os }}): $(tail -1 cov.txt | tr -s '\t ' ' ')" >> "$GITHUB_STEP_SUMMARY"

  # Model files, canonical-ABI records and WGSL sources come from untrusted
  # containers: every decoder is fuzzed on every change. The list grows with
  # the decoders; a target that does not exist fails the lane.
  fuzz:
    name: fuzz smoke ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzRealloc, pkg: ./internal/reentry }
          # ONNX models and tensors come from containers.
          - { target: FuzzRun, pkg: ./onnx }
          - { target: FuzzDecodeTensor, pkg: ./onnx }
          # wasi-nn calls: every argument and the memory are the guest's.
          - { target: FuzzHostCalls, pkg: ./nn }
          # Canonical ABI loads, and wasi:webgpu calls with any arguments.
          - { target: FuzzLoad, pkg: ./wit }
          - { target: FuzzWebGPUCalls, pkg: ./webgpu }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - run: go version
      - run: go test -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime 45s ${{ matrix.pkg }}

  vulns:
    name: govulncheck, judged by vulngate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - run: go version
      # No pipefail on purpose: govulncheck's exit status does not say
      # whether a finding is reachable; vulngate judges the JSON, and an
      # empty scan is refused outright.
      - name: govulncheck, judged by vulngate
        run: |
          set -eu
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/go-fleettools/fleettools/cmd/vulngate@v0.20.1
          BIN="$(go env GOPATH)/bin"
          "$BIN/govulncheck" -format json ./... > /tmp/vuln.json || true
          test -s /tmp/vuln.json || { echo "::error::govulncheck wrote nothing at all"; exit 1; }
          "$BIN/vulngate" -go "$(go env GOVERSION)" /tmp/vuln.json

  # Guest bindings run inside containers (wasip1); browser hosts run in the
  # playground's engine worker (js). Both must keep building and vetting.
  wasm:
    name: build and vet for ${{ matrix.goos }}/wasm
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [wasip1, js]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - run: go version
      - run: GOOS=${{ matrix.goos }} GOARCH=wasm CGO_ENABLED=0 go build ./...
      - run: GOOS=${{ matrix.goos }} GOARCH=wasm CGO_ENABLED=0 go vet ./...

  # The WebGPU wasi-nn backend in a real browser worker, on the ONNX node
  # tests and MNIST-12 (e2e/webgpu_test.go). The macOS lane must get a GPU
  # adapter: a fallback (software) adapter fails it. The Linux lane runs the
  # same WGSL on SwiftShader and says so: it proves the kernels, not a GPU.
  webgpu:
    name: WebGPU e2e (${{ matrix.lane }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { lane: 'macos-latest, GPU', os: macos-latest, fallback: '0', args: '' }
          # Headless Linux Chromium can back a WebGPU canvas only with Skia on
          # Vulkan (ExternalVkImageBacking; the headless Ozone platform has no
          # native pixmaps): without these flags the WebGPU instance is torn
          # down at the first canvas configure and every frame is blank.
          # Found with `gpuprobe --canvas --try`; see docs/DESIGN.md.
          - { lane: 'ubuntu, SwiftShader fallback', os: ubuntu-latest, fallback: '1', args: '--enable-features=Vulkan --use-vulkan=swiftshader --use-angle=swiftshader' }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: go version && node --version
      - name: Playwright driver and Chromium
        shell: bash
        run: |
          echo "PLAYWRIGHT_DRIVER_PATH=$RUNNER_TEMP/pwdriver" >> "$GITHUB_ENV"
          echo "PLAYWRIGHT_NODEJS_PATH=$(command -v node)" >> "$GITHUB_ENV"
          go run github.com/go-wasmcontainers/playground/cmd/site@v0.2.0 playwright-driver --dir "$RUNNER_TEMP/pwdriver"
          PLAYWRIGHT_DRIVER_PATH="$RUNNER_TEMP/pwdriver" PLAYWRIGHT_NODEJS_PATH="$(command -v node)" \
            go run github.com/playwright-community/playwright-go/cmd/playwright install --with-deps chromium
      - name: the adapter this runner's browser offers
        shell: bash
        run: |
          probe_args="${{ matrix.args }}"
          if [ "${{ matrix.fallback }}" = 1 ]; then probe_args="--enable-unsafe-webgpu $probe_args"; fi
          # --canvas follows one WebGPU canvas frame from the GPU to the page.
          go run ./internal/cmd/gpuprobe --browser chromium --channel chromium --canvas --args "$probe_args" > "$RUNNER_TEMP/probe.json"
          cat "$RUNNER_TEMP/probe.json"
          { echo '### WebGPU adapter (${{ matrix.lane }})'; echo '```json'; cat "$RUNNER_TEMP/probe.json"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: go test -tags e2e
        shell: bash
        env:
          GPU_E2E_ALLOW_FALLBACK: ${{ matrix.fallback }}
          GPU_E2E_ARGS: ${{ matrix.args }}
        run: |
          # bash -e would exit at a failing go test before the log is shown.
          status=0
          go test -tags e2e -count=1 -v -timeout 20m ./e2e/ > "$RUNNER_TEMP/e2e.log" 2>&1 || status=$?
          cat "$RUNNER_TEMP/e2e.log"
          exit $status

  cross:
    name: cross ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: darwin, goarch: arm64 }
          - { goos: linux, goarch: '386' }
          - { goos: windows, goarch: amd64 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with: { go-version: '1.27.3' }
      - run: go version
      - run: GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 go build ./...
